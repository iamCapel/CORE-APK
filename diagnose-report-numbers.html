<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Números de Reporte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            border-left: 5px solid;
        }
        .info { background: #e3f2fd; border-color: #2196F3; }
        .success { background: #e8f5e9; border-color: #4CAF50; }
        .warning { background: #fff3e0; border-color: #ff9800; }
        .error { background: #ffebee; border-color: #f44336; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
        }
        button:hover { opacity: 0.9; }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
            font-weight: bold;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .missing {
            color: #f44336;
            font-weight: bold;
        }
        .present {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Diagnóstico de Números de Reporte en Firebase</h1>
        
        <div class="status info">
            <strong>ℹ️ Información:</strong>
            <p>Esta herramienta diagnostica y corrige reportes en Firebase que no tienen número de reporte asignado.</p>
        </div>

        <button id="diagnoseBtn" onclick="diagnoseReports()">Diagnosticar Reportes</button>
        <button id="fixBtn" onclick="fixReports()" style="display:none;" disabled>Corregir Reportes</button>
        
        <div id="results"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBULoCr78BEnY8ovO1AdXvrn1JYfDqud6c",
            authDomain: "coredatabase-206ac.firebaseapp.com",
            projectId: "coredatabase-206ac",
            storageBucket: "coredatabase-206ac.firebasestorage.app",
            messagingSenderId: "204486232524",
            appId: "1:204486232524:web:d705e374692a8290fb3569",
            measurementId: "G-WWS6LZ5WR1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let reportsWithoutNumber = [];

        window.diagnoseReports = async function() {
            const diagnoseBtn = document.getElementById('diagnoseBtn');
            const fixBtn = document.getElementById('fixBtn');
            const results = document.getElementById('results');
            
            diagnoseBtn.disabled = true;
            results.innerHTML = '<div class="status info">⏳ Cargando reportes de Firebase...</div>';
            
            try {
                const reportsSnapshot = await getDocs(collection(db, 'reports'));
                const reports = [];
                
                reportsSnapshot.forEach((doc) => {
                    const data = doc.data();
                    reports.push({
                        id: doc.id,
                        ...data
                    });
                });
                
                console.log(`📊 Total de reportes encontrados: ${reports.length}`);
                
                // Analizar reportes
                const withNumber = [];
                const withoutNumber = [];
                
                reports.forEach(report => {
                    if (report.numeroReporte && report.numeroReporte.trim() !== '') {
                        withNumber.push(report);
                    } else {
                        withoutNumber.push(report);
                    }
                });
                
                reportsWithoutNumber = withoutNumber;
                
                // Mostrar resultados
                let html = `
                    <div class="status success">
                        <strong>✅ Diagnóstico Completado</strong>
                        <p>Total de reportes: ${reports.length}</p>
                        <p class="present">Con número de reporte: ${withNumber.length}</p>
                        <p class="missing">Sin número de reporte: ${withoutNumber.length}</p>
                    </div>
                `;
                
                if (withNumber.length > 0) {
                    html += `
                        <h3>✅ Reportes con número de reporte (${withNumber.length})</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Número de Reporte</th>
                                    <th>ID</th>
                                    <th>Tipo Intervención</th>
                                    <th>Fecha</th>
                                    <th>Creado Por</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    withNumber.forEach(report => {
                        html += `
                            <tr>
                                <td class="present">${report.numeroReporte || 'N/A'}</td>
                                <td>${report.id.substring(0, 20)}...</td>
                                <td>${report.tipoIntervencion || 'N/A'}</td>
                                <td>${report.timestamp ? new Date(report.timestamp).toLocaleDateString() : 'N/A'}</td>
                                <td>${report.creadoPor || 'N/A'}</td>
                            </tr>
                        `;
                    });
                    
                    html += `
                            </tbody>
                        </table>
                    `;
                }
                
                if (withoutNumber.length > 0) {
                    html += `
                        <h3>❌ Reportes SIN número de reporte (${withoutNumber.length})</h3>
                        <div class="status warning">
                            <strong>⚠️ Atención:</strong>
                            <p>Estos reportes necesitan ser corregidos para asignarles un número de reporte.</p>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tipo Intervención</th>
                                    <th>Fecha</th>
                                    <th>Creado Por</th>
                                    <th>Provincia</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    withoutNumber.forEach(report => {
                        html += `
                            <tr>
                                <td class="missing">${report.id.substring(0, 30)}...</td>
                                <td>${report.tipoIntervencion || 'N/A'}</td>
                                <td>${report.timestamp ? new Date(report.timestamp).toLocaleDateString() : 'N/A'}</td>
                                <td>${report.creadoPor || 'N/A'}</td>
                                <td>${report.provincia || 'N/A'}</td>
                            </tr>
                        `;
                    });
                    
                    html += `
                            </tbody>
                        </table>
                    `;
                    
                    fixBtn.style.display = 'block';
                    fixBtn.disabled = false;
                }
                
                results.innerHTML = html;
                diagnoseBtn.disabled = false;
                
            } catch (error) {
                console.error('Error en diagnóstico:', error);
                results.innerHTML = `
                    <div class="status error">
                        <strong>❌ Error en diagnóstico:</strong>
                        <p>${error.message}</p>
                    </div>
                `;
                diagnoseBtn.disabled = false;
            }
        };

        window.fixReports = async function() {
            const fixBtn = document.getElementById('fixBtn');
            const results = document.getElementById('results');
            
            if (reportsWithoutNumber.length === 0) {
                alert('No hay reportes para corregir');
                return;
            }
            
            const confirmed = confirm(`¿Está seguro que desea asignar números de reporte a ${reportsWithoutNumber.length} reportes?\n\nEsto actualizará los reportes en Firebase.`);
            
            if (!confirmed) return;
            
            fixBtn.disabled = true;
            results.innerHTML = '<div class="status info">⏳ Corrigiendo reportes...</div>';
            
            try {
                // Obtener el último número de reporte usado
                const allReports = await getDocs(collection(db, 'reports'));
                let maxNumber = 0;
                const year = new Date().getFullYear();
                
                allReports.forEach(doc => {
                    const data = doc.data();
                    if (data.numeroReporte) {
                        const match = data.numeroReporte.match(/DCR-(\d+)-(\d+)/);
                        if (match) {
                            const num = parseInt(match[2]);
                            if (num > maxNumber) {
                                maxNumber = num;
                            }
                        }
                    }
                });
                
                console.log(`📊 Último número de reporte encontrado: ${maxNumber}`);
                
                let nextNumber = maxNumber + 1;
                const fixed = [];
                const errors = [];
                
                for (const report of reportsWithoutNumber) {
                    try {
                        const newReportNumber = `DCR-${year}-${String(nextNumber).padStart(6, '0')}`;
                        
                        // Actualizar en Firebase
                        const reportRef = doc(db, 'reports', report.id);
                        await updateDoc(reportRef, {
                            numeroReporte: newReportNumber,
                            fechaModificacion: new Date().toISOString()
                        });
                        
                        fixed.push({
                            id: report.id,
                            newNumber: newReportNumber
                        });
                        
                        nextNumber++;
                        
                        console.log(`✅ Reporte ${report.id} actualizado con número ${newReportNumber}`);
                        
                    } catch (error) {
                        console.error(`Error actualizando reporte ${report.id}:`, error);
                        errors.push({
                            id: report.id,
                            error: error.message
                        });
                    }
                }
                
                // Mostrar resultados
                let html = `
                    <div class="status success">
                        <strong>✅ Corrección Completada</strong>
                        <p>Reportes corregidos: ${fixed.length}</p>
                        <p>Errores: ${errors.length}</p>
                    </div>
                `;
                
                if (fixed.length > 0) {
                    html += `
                        <h3>✅ Reportes corregidos (${fixed.length})</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nuevo Número de Reporte</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    fixed.forEach(item => {
                        html += `
                            <tr>
                                <td>${item.id.substring(0, 30)}...</td>
                                <td class="present">${item.newNumber}</td>
                            </tr>
                        `;
                    });
                    
                    html += `
                            </tbody>
                        </table>
                    `;
                }
                
                if (errors.length > 0) {
                    html += `
                        <h3>❌ Errores (${errors.length})</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Error</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    errors.forEach(item => {
                        html += `
                            <tr>
                                <td>${item.id.substring(0, 30)}...</td>
                                <td class="missing">${item.error}</td>
                            </tr>
                        `;
                    });
                    
                    html += `
                            </tbody>
                        </table>
                    `;
                }
                
                results.innerHTML = html;
                fixBtn.style.display = 'none';
                
            } catch (error) {
                console.error('Error corrigiendo reportes:', error);
                results.innerHTML = `
                    <div class="status error">
                        <strong>❌ Error al corregir reportes:</strong>
                        <p>${error.message}</p>
                    </div>
                `;
                fixBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
