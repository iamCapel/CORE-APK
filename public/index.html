<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOPC Dashboard</title>
    <link rel="icon" href="%PUBLIC_URL%/core-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#FF7A00" />
    <meta name="description" content="Panel de Control MOPC - Sistema de gestión de intervenciones del Ministerio de Obras Públicas" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/core-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --orange: #FF6B00;
        --orange-light: #FF8C33;
        --orange-glow: rgba(255, 107, 0, 0.35);
        --glass-bg: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-border-hover: rgba(255, 107, 0, 0.4);
        --dark-bg: #0a0a0c;
        --dark-surface: #111114;
        --smoke: rgba(20, 20, 25, 0.85);
        --text-primary: rgba(255,255,255,0.92);
        --text-muted: rgba(255,255,255,0.38);
        --text-sub: rgba(255,255,255,0.55);
      }
      body {
        font-family: 'Inter', sans-serif;
        background: var(--dark-bg);
        min-height: 100vh;
        color: var(--text-primary);
        overflow-x: hidden;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 40% at 15% 20%, rgba(255,107,0,0.12) 0%, transparent 60%),
          radial-gradient(ellipse 40% 60% at 85% 80%, rgba(255,100,0,0.08) 0%, transparent 55%),
          radial-gradient(ellipse 80% 30% at 50% 50%, rgba(255,60,0,0.04) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        opacity: 0.5;
        z-index: 0;
      }
    </style>
    <script async defer 
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBIwzALxUUNxYBdgGY7MoCNW_1DGdFhF-4&libraries=places,geometry">
    </script>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>

</html>
